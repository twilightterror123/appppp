<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEW AI</title><style>
:root{--bg:#05070b;--p:#0c1219;--p2:#111b24;--line:#1d2a34;--c:#67e8ff;--t:#edf8fb;--m:#8fa4ad}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#123846,#05070b 55%);color:var(--t);font:15px system-ui,Arial}.app{height:100vh;display:grid;grid-template-columns:250px 1fr}.side{padding:22px;border-right:1px solid var(--line);background:#05080ce8}.logo{font-weight:900;letter-spacing:2px;font-size:18px}.mark{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--c);border-radius:13px;color:var(--c);margin-right:9px}.side button{display:block;width:100%;margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--p);color:var(--t);text-align:left;cursor:pointer}.status{margin-top:30px;padding:13px;border:1px solid var(--line);border-radius:14px;color:var(--m);font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px}.main{display:grid;grid-template-rows:64px 1fr 88px}.top{border-bottom:1px solid var(--line);padding:0 24px;display:flex;justify-content:space-between;align-items:center}.badge{color:var(--c);border:1px solid #24515c;border-radius:20px;padding:6px 10px;font-size:11px}.chat{overflow:auto;padding:30px max(20px,calc((100vw - 850px)/2))}.welcome{text-align:center;margin:9vh auto 30px;max-width:650px}.big{font-size:64px;font-weight:900}.c{color:var(--c)}.muted{color:var(--m);line-height:1.7}.caps{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.cap{padding:7px 11px;border:1px solid var(--line);border-radius:20px;background:var(--p);color:var(--m);font-size:12px}.msg{display:flex;margin:0 auto 16px;max-width:760px}.msg.u{justify-content:flex-end}.bubble{max-width:80%;padding:13px 16px;border-radius:18px;background:var(--p2);border:1px solid var(--line);white-space:pre-wrap;line-height:1.55}.u .bubble{background:#10303a;border-color:#24515c}.composer{border-top:1px solid var(--line);padding:14px max(20px,calc((100vw - 850px)/2));display:flex;gap:9px;background:#05070bf2}.composer textarea{flex:1;background:var(--p);color:var(--t);border:1px solid var(--line);border-radius:15px;padding:13px;resize:none;outline:0}.send{width:52px;border:0;border-radius:15px;background:var(--c);font-weight:900}.panel{display:none;overflow:auto;padding:35px max(20px,calc((100vw - 850px)/2))}.card{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.big{font-size:45px}}
</style></head><body><div class="app"><aside class="side"><div class="logo"><span class="mark">N</span>NEW AI</div><button onclick="newChat()">＋ Neuer Chat</button><button onclick="chatView()">◉ Chat</button><button onclick="memoryView()">◈ Memory</button><button onclick="toolsView()">⚙ Werkzeuge</button><button onclick="aboutView()">ⓘ Über</button><div class="status"><span class="dot"></span>LOCAL CORE<br>Kein API-Key · kein externer KI-Dienst</div></aside><main class="main"><header class="top"><b>NEW AI <span style="color:var(--m)">/ Offline Core</span></b><span class="badge">NO API</span></header><section class="chat" id="chat"><div class="welcome" id="welcome"><div class="big">NEW <span class="c">AI.</span></div><p class="muted">Eigener lokaler Assistant-Core. Chat, Memory, Rechner, Zeit, Datum und Notizen funktionieren direkt im Browser.</p><div class="caps"><span class="cap">Offline</span><span class="cap">Memory</span><span class="cap">Rechner</span><span class="cap">Notizen</span></div></div></section><section class="panel" id="panel"></section><div class="composer"><textarea id="input" rows="1" placeholder="Schreib NEW AI etwas …"></textarea><button class="send" onclick="send()">➤</button></div></main></div><script>
var KEY="new_ai_memory",mem=JSON.parse(localStorage.getItem(KEY)||"{}"),chat=document.getElementById("chat"),panel=document.getElementById("panel"),input=document.getElementById("input");
function esc(s){return s.replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}function add(cls,t){var w=document.getElementById("welcome");if(w)w.style.display="none";var d=document.createElement("div");d.className="msg "+cls;d.innerHTML="<div class='bubble'>"+esc(t)+"</div>";chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function save(){localStorage.setItem(KEY,JSON.stringify(mem))}
function calc(s){var x=s.replace(/[^0-9+\-*/().,%^ ]/g,"").replace(/,/g,".").replace(/%/g,"/100").replace(/\^/g,"**");if(!x.trim()||!/^[0-9+\-*/().%\s*]+$/.test(x))return null;try{var v=Function("return ("+x+")")();return Number.isFinite(v)?String(v):null}catch(e){return null}}
function think(t){var n=t.toLowerCase(),v;if(/^(hi|hallo|hey|moin|servus)\b/.test(n))return"Hey! Ich bin NEW AI und laufe lokal in diesem Browser.";if(/wer bist du|was bist du/.test(n))return"Ich bin NEW AI, ein eigener lokaler Assistant-Core ohne API.";if(/hilfe|was kannst du|funktionen/.test(n))return"Ich kann lokal chatten, Memory speichern, rechnen, Uhrzeit und Datum nennen, Notizen speichern und meinen Status anzeigen.";if(/uhrzeit|wie spät|wie spat/.test(n))return"Lokale Uhrzeit: "+new Date().toLocaleTimeString("de-DE");if(/datum|welcher tag|heute/.test(n))return"Heute ist "+new Date().toLocaleDateString("de-DE",{weekday:"long",year:"numeric",month:"long",day:"numeric"})+".";if(/^rechne\s+/.test(n)){v=calc(t.replace(/^rechne\s+/i,""));return v?"Ergebnis: "+v:"Ausdruck nicht erkannt."}if(/mein name ist|ich heiße|ich heisse/.test(n)){v=t.replace(/.*?(mein name ist|ich heiße|ich heisse)\s*/i,"").trim();mem.name=v;save();return"Gespeichert. Dein Name ist lokal gespeichert."}if(/wie heiße ich|was ist mein name/.test(n))return mem.name?"Du heißt "+mem.name+".":"Ich kenne deinen Namen noch nicht.";if(/merke dir|merk dir/.test(n)){v=t.replace(/.*?(merke dir|merk dir)\s*/i,"").trim();mem.note=v;save();return v?"Gespeichert.":"Was soll ich mir merken?"}if(/memory|gedächtnis|was merkst du/.test(n))return Object.keys(mem).length?"Lokales Memory:\n"+Object.keys(mem).map(function(k){return"• "+k+": "+mem[k]}).join("\n"):"Memory ist leer.";if(/lösche memory|vergiss alles|memory löschen/.test(n)){mem={};save();return"Lokales Memory gelöscht."}if(/notiz/.test(n)){v=t.replace(/.*?notiz\s*/i,"").trim();if(v){mem.notes=mem.notes||[];mem.notes.push(v);save();return"Notiz lokal gespeichert."}return(mem.notes||[]).join("\n")||"Keine Notizen."}if(/status|stabil|ping/.test(n))return"Status: LOCAL CORE aktiv · API 0 · Memory lokal.";return"Ich habe dafür in meinem lokalen Core noch keine passende Fähigkeit. Diese Version ist bewusst ohne API und daher kein großes generatives Sprachmodell."}
function send(){var t=input.value.trim();if(!t)return;add("u",t);input.value="";setTimeout(function(){add("a",think(t))},120)}input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});function chatView(){panel.style.display="none";chat.style.display="block"}function newChat(){location.reload()}function memoryView(){chat.style.display="none";panel.style.display="block";panel.innerHTML="<h2>Memory</h2><p class='muted'>Nur lokal in diesem Browser.</p><div class='card'>"+(Object.keys(mem).length?Object.keys(mem).map(function(k){return"<b>"+esc(k)+"</b><br><span class='muted'>"+esc(String(mem[k]))+"</span>"}).join("<hr>"):"Memory ist leer.")+"</div>"}function toolsView(){chat.style.display="none";panel.style.display="block";panel.innerHTML="<h2>Werkzeuge</h2><div class='card'><b>Rechner</b><p class='muted'>„rechne 12 * 8 + 4“</p></div><div class='card'><b>Notizen</b><p class='muted'>„Notiz Kaufe Milch“</p></div><div class='card'><b>Zeit / Datum</b><p class='muted'>„Wie spät ist es?“</p></div>"}function aboutView(){chat.style.display="none";panel.style.display="block";panel.innerHTML="<h2>NEW AI</h2><div class='card'><b>Offline Core</b><p class='muted'>Keine externe API und kein API-Key. Für echtes LLM-Niveau muss später ein Sprachmodell lokal eingebunden werden.</p></div>"}
</script></body></html>
